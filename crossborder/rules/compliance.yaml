# -----------------------------------------------------------------------------
# PACK RULES - physical thresholds applied after the pack parser runs.
# -----------------------------------------------------------------------------
pack_rules:
  - id: PK-HEAVY-001
    max_billable_g: 20000
    verdict: REVIEW
    dimension: DUTY
    reason: "Over 20 kg net: freight exceeds typical goods value, and the parcel may need formal customs entry rather than an informal clearance."
    authority: "19 CFR 143.21 (informal entry limit USD 2500)"

  - id: PK-UNKNOWN-002
    on_unparseable_pack: true
    verdict: REVIEW
    dimension: DUTY
    reason: "Pack size could not be parsed, so shipping weight cannot be computed. Quoting this SKU risks under-charging freight."
    authority: "Operational constraint"
